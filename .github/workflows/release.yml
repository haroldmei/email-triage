name: Desktop Release Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  validate-version:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
      should_publish: ${{ steps.version.outputs.should_publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve release version
        id: version
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          actual="${GITHUB_REF_NAME}"

          if [[ "${GITHUB_REF}" == refs/tags/v* && "$actual" != "$expected" ]]; then
            echo "Tag $actual does not match package version $expected"
            exit 1
          fi

          echo "release_tag=$expected" >> "$GITHUB_OUTPUT"

          if [[ "${GITHUB_EVENT_NAME}" == "push" && ( "${GITHUB_REF}" == "refs/heads/main" || "${GITHUB_REF}" == refs/tags/v* ) ]]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: [validate-version]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify Google OAuth configuration
        run: node -e "if (!process.env.VITE_GOOGLE_CLIENT_ID || !process.env.VITE_GOOGLE_CLIENT_ID.trim()) { console.error('Repository variable GOOGLE_OAUTH_CLIENT_ID is required for release builds'); process.exit(1); }"
      - run: npm install
      - run: npm run tauri icon src-tauri/icons/icon.png
      - run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: email-triage-${{ runner.os }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error

  publish-release:
    if: needs.validate-version.outputs.should_publish == 'true'
    needs: [validate-version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate-version.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: Email Triage ${{ needs.validate-version.outputs.release_tag }}
          generate_release_notes: true
          files: |
            release-assets/**/*
          fail_on_unmatched_files: true
