[package]
name = "email-triage"
version = "0.1.0"
description = "Local-first email triage desktop app"
authors = ["Email Triage contributors"]
edition = "2021"

[lib]
name = "email_triage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
