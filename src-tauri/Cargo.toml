[package]
name = "email-triage"
version = "0.1.19"
description = "Local-first email triage desktop app"
authors = ["Email Triage contributors"]
edition = "2021"

[lib]
name = "email_triage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "rt-multi-thread", "macros", "time", "sync"] }
async-imap = { version = "0.11.3", default-features = false, features = ["runtime-tokio"] }
async-native-tls = { version = "0.6.0", default-features = false, features = ["runtime-tokio"] }
futures = "0.3"
mailparse = "0.16.1"
regex = "1"
pinyin = "0.10"
thiserror = "2"
keyring = "4.1.6"
oauth2 = "5.0.0"
reqwest = { version = "0.12", features = ["json", "multipart"] }
url = "2"
open = "5"
sha2 = "0.10"
hex = "0.4"
pdf-extract = { package = "email-triage-pdf-extract-safe", path = "pdf-extract-safe" }
zip = { version = "8.6", default-features = false, features = ["deflate"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
